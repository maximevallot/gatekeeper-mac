name: Gatekeeper
options:
  bundleIdPrefix: com.gatekeeper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gatekeeper:
    type: application
    platform: macOS
    sources: [Gatekeeper, Shared]
    scheme:
      testTargets: [GatekeeperTests]
    dependencies:
      # The bridge the extension calls, inside the app at Contents/MacOS/gatekeeper-bridge.
      - target: gatekeeper-bridge
        embed: true
        codeSign: true
        copy:
          destination: executables
      # The Safari version of the extension, at Contents/PlugIns/GatekeeperSafari.appex.
      - target: GatekeeperSafari
        embed: true
        codeSign: true
    info:
      path: Gatekeeper/Info.plist
      properties:
        CFBundleDisplayName: Gatekeeper
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatekeeper.mac
        PRODUCT_NAME: Gatekeeper
        # Free Apple ID: "Sign to Run Locally". No team, no account, no paid program needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
  GatekeeperSafari:
    # A Safari Web Extension: ~/gatekeeper-app/extension, copied in at build time (read only), plus the handler
    # that answers its native messages for the Mac link.
    type: app-extension
    platform: macOS
    sources: [Safari, Shared]
    preBuildScripts: []
    postCompileScripts:
      - name: Copy the web extension from ~/gatekeeper-app
        script: '"$SRCROOT/scripts/copy-web-extension.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Safari/Info.plist
      properties:
        CFBundleDisplayName: Gatekeeper
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Safari/Safari.entitlements
      properties:
        # Safari loads only sandboxed extensions.
        com.apple.security.app-sandbox: true
        # The one folder the Mac link uses, shared with Gatekeeper.app and the Chrome/Brave bridge.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/Gatekeeper/
    settings:
      base:
        PRODUCT_NAME: GatekeeperSafari
        PRODUCT_BUNDLE_IDENTIFIER: com.gatekeeper.mac.safari
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        # The copy script reads ~/gatekeeper-app, outside this project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SKIP_INSTALL: YES
  gatekeeper-bridge:
    type: tool
    platform: macOS
    sources: [Bridge, Shared]
    settings:
      base:
        PRODUCT_NAME: gatekeeper-bridge
        PRODUCT_BUNDLE_IDENTIFIER: com.gatekeeper.mac.bridge
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
  GatekeeperTests:
    # Logic only: these files are compiled into the test bundle, so the tests launch no app and touch no other app.
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - Gatekeeper/Today/Snapshot.swift
      - Gatekeeper/Exam/ExamGuard.swift
      - Gatekeeper/Mac/Browsers.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatekeeper.mac.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
