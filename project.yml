name: Gatekeeper
options:
  bundleIdPrefix: com.gatekeeper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gatekeeper:
    type: application
    platform: macOS
    sources: [Gatekeeper, Shared]
    dependencies:
      # The bridge the extension calls, inside the app at Contents/MacOS/gatekeeper-bridge.
      - target: gatekeeper-bridge
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Gatekeeper/Info.plist
      properties:
        CFBundleDisplayName: Gatekeeper
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatekeeper.mac
        PRODUCT_NAME: Gatekeeper
        # Free Apple ID: "Sign to Run Locally". No team, no account, no paid program needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
  gatekeeper-bridge:
    type: tool
    platform: macOS
    sources: [Bridge, Shared]
    settings:
      base:
        PRODUCT_NAME: gatekeeper-bridge
        PRODUCT_BUNDLE_IDENTIFIER: com.gatekeeper.mac.bridge
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
